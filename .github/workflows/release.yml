name: Release

on:
  push:
    branches: [main]
    # A merge that changes nothing the app ships would publish a release whose
    # only effect is restarting ClaudeBar on every Mac running it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - "ClaudeBarTests/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 2.0.0. Leave empty to bump the minor."
        required: false
        type: string

permissions:
  contents: write

# Two merges landing together must not race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    # Leading, not merely present: `contains` skipped the release that
    # introduced this workflow, because the commit body explaining the marker
    # counted as using it. The subject of a squash merge is the PR title, so
    # skipping now means titling the PR `[skip release] …` and nothing else does.
    if: ${{ !startsWith(github.event.head_commit.message, '[skip release]') }}
    # Xcode 27 / macOS 27 SDK, matching what the app is developed against.
    # v1.0.0 shipped from macos-15, which is Xcode 16.4 and the macOS 15.5 SDK,
    # and SwiftUI sized the popover differently there — the menu bar window
    # grew to the tallest tab and never shrank back. A release has to be built
    # by the toolchain it was tested on.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the next version is read from the newest tag.
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(./scripts/next-version.sh)
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — nothing was published."
            exit 1
          fi
          echo "Publishing v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project ClaudeBar.xcodeproj \
            -scheme ClaudeBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ClaudeBar.xcodeproj \
            -scheme ClaudeBar \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign
        run: |
          set -euo pipefail
          codesign --force --deep --sign - \
            --entitlements ClaudeBar/ClaudeBar.entitlements \
            build/Build/Products/Release/ClaudeBar.app
          # The updater runs this same check on the download before it deletes
          # the copy it is replacing, so a failure here has to stop the release.
          codesign --verify --strict build/Build/Products/Release/ClaudeBar.app

      - name: Verify the built version
        run: |
          set -euo pipefail
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build/Build/Products/Release/ClaudeBar.app/Contents/Info.plist)
          if [ "$BUILT" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Built app reports $BUILT, this release is ${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc \
            build/Build/Products/Release/ClaudeBar.app \
            "dist/ClaudeBar-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/ClaudeBar-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
